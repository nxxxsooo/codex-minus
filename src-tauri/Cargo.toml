[package]
name = "codex-minus"
version = "0.4.4"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/nxxxsooo/codex-minus"
description = "Trimmed Codex++ Manager: provider switching, managed model catalogs, session lifecycle, and config diagnostics."

[lib]
name = "codex_minus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-minus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
codex-plus-core = { git = "https://github.com/BigPizzaV3/CodexPlusPlus", rev = "59a2f90364525cd929444690fe536b9896de455d", package = "codex-plus-core" }
codex-plus-data = { git = "https://github.com/BigPizzaV3/CodexPlusPlus", rev = "59a2f90364525cd929444690fe536b9896de455d", package = "codex-plus-data" }
directories = "6"
# No longer called from this crate, but the pinned core enables reqwest without "socks". Feature
# unification is additive, so this entry is the only thing giving provider connection tests SOCKS
# support — dropping it would silently break a profile reached through a socks5:// proxy.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
toml_edit = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
