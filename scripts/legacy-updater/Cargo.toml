[package]
name = "codex-minus-legacy-updater-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

# Test-only consumer of the exact updater shipped in v0.4.18. This is not part of the app/core
# Cargo workspace, resources or runtime dependency graph; no upstream code is copied here.
[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
tauri-plugin-updater = "=2.10.1"
serde_json = "1"
