# Build Codex Minus for macOS (arm64) and Windows (x64 + arm64)
#
# Triggered by:
#   - push/PR to master
#   - tags matching v*
#   - manual dispatch on any branch
#
# macOS: builds aarch64 .app bundle (ad-hoc signed)
# Windows: builds native x64 and arm64 .msi + .exe (NSIS) installers

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  # Build any branch on demand, so testing a change on Windows needs no local MSVC toolchain,
  # no merge to master, and no tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ─── macOS (aarch64) ───────────────────────────────────────────────────
  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build frontend
        run: npm run vite:build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build Tauri macOS bundle
        run: npx tauri build --bundles app --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Ad-hoc sign and verify macOS bundle
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Codex Minus.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package macOS .app.zip
        shell: bash
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          for f in *.app/Contents/Info.plist; do
            [ -f "$f" ] || { echo "::error::No .app bundle found"; exit 1; }
          done
          APP_NAME="Codex Minus.app"
          # A pull-request ref is `<number>/merge`, which is not a legal filename component.
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          zip -r "CodexMinus_${VERSION}_aarch64.app.zip" "$APP_NAME"
          ls -lh "CodexMinus_${VERSION}_aarch64.app.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMinus-macOS-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CodexMinus_*.app.zip
          if-no-files-found: error

  # ─── Windows (x64 + arm64) ─────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            run_tests: true
          - arch: arm64
            target: aarch64-pc-windows-msvc
            run_tests: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build frontend
        run: npm run vite:build

      - name: Run Rust tests
        if: matrix.run_tests
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - name: Check Rust ARM64 target
        if: matrix.run_tests == false
        working-directory: src-tauri
        run: cargo check --target ${{ matrix.target }}

      - name: Build Tauri Windows bundle (MSI + NSIS)
        run: npx tauri build --bundles msi,nsis --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMinus-Windows-${{ matrix.arch }}-MSI
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          compression-level: 0
          if-no-files-found: error

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMinus-Windows-${{ matrix.arch }}-NSIS
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          compression-level: 0
          if-no-files-found: error

  # ─── Release (tag push only) ──────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          mkdir -p dist

          # macOS: copy the pre-built .app.zip
          MAC_DIR="CodexMinus-macOS-arm64"
          if [ -d "$MAC_DIR" ]; then
            cp "$MAC_DIR"/CodexMinus_*.app.zip dist/ 2>/dev/null || true
          fi

          # Windows: require one MSI and one NSIS installer per architecture.
          for WIN_ARCH in x64 arm64; do
            WIN_MSI_DIR="CodexMinus-Windows-${WIN_ARCH}-MSI"
            MSI_SOURCES=( "$WIN_MSI_DIR"/*.msi )
            [ "${#MSI_SOURCES[@]}" -eq 1 ] || { echo "::error::Expected one Windows ${WIN_ARCH} MSI artifact"; exit 1; }
            cp "${MSI_SOURCES[0]}" "dist/CodexMinus_${GITHUB_REF_NAME#v}_${WIN_ARCH}.msi"

            WIN_NSIS_DIR="CodexMinus-Windows-${WIN_ARCH}-NSIS"
            EXE_SOURCES=( "$WIN_NSIS_DIR"/*.exe )
            [ "${#EXE_SOURCES[@]}" -eq 1 ] || { echo "::error::Expected one Windows ${WIN_ARCH} NSIS artifact"; exit 1; }
            cp "${EXE_SOURCES[0]}" "dist/CodexMinus_${GITHUB_REF_NAME#v}_${WIN_ARCH}-setup.exe"
          done

          cd dist
          MAC_FILES=( *.app.zip )
          MSI_FILES=( *.msi )
          EXE_FILES=( *.exe )
          [ "${#MAC_FILES[@]}" -eq 1 ] || { echo "::error::Expected one macOS app archive"; exit 1; }
          [ "${#MSI_FILES[@]}" -eq 2 ] || { echo "::error::Expected two Windows MSI files"; exit 1; }
          [ "${#EXE_FILES[@]}" -eq 2 ] || { echo "::error::Expected two Windows NSIS installers"; exit 1; }
          sha256sum "${MAC_FILES[@]}" "${MSI_FILES[@]}" "${EXE_FILES[@]}" > SHA256SUMS
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex Minus ${{ github.ref_name }}
          body: |
            ## Codex Minus ${{ github.ref_name }}

            ### 下载

            | 平台 | 架构 | 格式 |
            |------|------|------|
            | macOS | arm64 | .app.zip |
            | Windows | x64 | .msi / .exe (NSIS) |
            | Windows | arm64 | .msi / .exe (NSIS) |

            各平台的安装包与本页面的 `SHA256SUMS` 已作为附件附加到本 Release。

            ### 校验

            ```bash
            # macOS
            shasum -a 256 -c SHA256SUMS
            ```

            ### 安装说明

            **macOS**: 解压后将 `Codex Minus.app` 移入 `/Applications`。首次启动如被拦截，在「系统设置 → 隐私与安全性」中选择「仍要打开」。

            **Windows**: ARM 设备请选择 `arm64`，Intel／AMD 设备请选择 `x64`；运行对应的 `.msi` 或 `.exe` 安装程序。
          files: |
            artifacts/dist/*
          fail_on_unmatched_files: true
