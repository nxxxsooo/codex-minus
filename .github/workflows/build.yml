# Electron bundles with a matching standalone Rust core. Signing is release-only;
# PR artifacts are review builds and never publish an update feed.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
      - name: Verify renderer and desktop contracts
        run: npm run verify
      - name: Rust tests and real core CLI
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Headless native update and rollback
        run: npm run update:smoke:mac
      - name: Package Electron macOS arm64
        run: node scripts/desktop-package.mjs darwin arm64
      - name: Verify packaged resources and headless entry points
        run: node scripts/verify-package.mjs "dist-desktop/mac-arm64/Codex Minus.app" darwin arm64
      - name: Headless packaged provider and session workflows
        run: CODEX_MINUS_SMOKE_APP="$PWD/dist-desktop/mac-arm64/Codex Minus.app/Contents/MacOS/codex-minus" node scripts/desktop-smoke.mjs --headless
      - name: Verify actual Tauri-to-Electron replacement headlessly
        run: |
          cargo build --locked --manifest-path scripts/legacy-updater/Cargo.toml
          node scripts/legacy-updater-smoke.mjs
      - name: Sign update artifact with the existing minisign trust key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          ARTIFACT="dist-desktop/CodexMinus_${VERSION}_aarch64.app.tar.gz"
          npx --yes @tauri-apps/cli@2.11.2 signer sign "$ARTIFACT"
          src-tauri/target/aarch64-apple-darwin/release/codex-minus-core --verify-update "$ARTIFACT" "$ARTIFACT.sig" "$(shasum -a 256 "$ARTIFACT" | cut -d ' ' -f 1)" "$(stat -f %z "$ARTIFACT")"
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMinus-macOS-arm64
          path: |
            dist-desktop/CodexMinus_*.app.zip
            dist-desktop/CodexMinus_*.app.tar.gz
            dist-desktop/CodexMinus_*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CODEX_MINUS_CI_PROFILE_TEST: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            native: true
            unpacked: win-unpacked
          - arch: arm64
            target: aarch64-pc-windows-msvc
            native: false
            unpacked: win-arm64-unpacked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
      - name: Native Rust tests
        if: matrix.native
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Native stdio ownership in the disposable Windows profile
        if: matrix.native
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --test stdio_runtime windows_ci_profile_roundtrip -- --ignored
      - name: Package Electron and matching Rust core
        run: node scripts/desktop-package.mjs win32 ${{ matrix.arch }}
      - name: Verify package architecture and native entry points where available
        run: node scripts/verify-package.mjs "dist-desktop/${{ matrix.unpacked }}" win32 ${{ matrix.arch }}
      - name: Verify copied Windows helper and real signature rejection
        if: matrix.native
        run: node scripts/update-windows-smoke.mjs dist-desktop/win-unpacked
      - name: Verify v0.4.18 automatic-upgrade handoff
        if: matrix.native
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/legacy-upgrade-windows.ps1
      - name: Sign installer with the existing minisign trust key
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Signing key unavailable" }
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/version mismatch" }
          $artifact = "dist-desktop/CodexMinus_${version}_${{ matrix.arch }}-setup.exe"
          npx --yes @tauri-apps/cli@2.11.2 signer sign "$artifact"
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMinus-Windows-${{ matrix.arch }}-NSIS
          path: |
            dist-desktop/CodexMinus_*-setup.exe
            dist-desktop/CodexMinus_*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and verify the signed Electron feed
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          mkdir -p artifacts/dist
          cp artifacts/CodexMinus-macOS-arm64/CodexMinus_* artifacts/dist/
          cp artifacts/CodexMinus-Windows-x64-NSIS/CodexMinus_* artifacts/dist/
          cp artifacts/CodexMinus-Windows-arm64-NSIS/CodexMinus_* artifacts/dist/
          for FILE in "CodexMinus_${VERSION}_aarch64.app.tar.gz" "CodexMinus_${VERSION}_x64-setup.exe" "CodexMinus_${VERSION}_arm64-setup.exe"; do
            ARTIFACT="artifacts/dist/$FILE"
            src-tauri/target/release/codex-minus-core --verify-update "$ARTIFACT" "$ARTIFACT.sig" "$(sha256sum "$ARTIFACT" | cut -d ' ' -f 1)" "$(stat -c %s "$ARTIFACT")"
          done
          node scripts/electron-release-manifest.mjs "$VERSION" artifacts/dist
          npx --yes @tauri-apps/cli@2.11.2 signer sign artifacts/dist/electron-latest.json
          src-tauri/target/release/codex-minus-core --verify-update artifacts/dist/electron-latest.json artifacts/dist/electron-latest.json.sig "$(sha256sum artifacts/dist/electron-latest.json | cut -d ' ' -f 1)" "$(stat -c %s artifacts/dist/electron-latest.json)"
          cd artifacts/dist
          sha256sum CodexMinus_* electron-latest.json electron-latest.json.sig latest.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex Minus ${{ github.ref_name }}
          body: |
            ## Codex Minus ${{ github.ref_name }} · Electron

            macOS arm64：下载 `.app.zip`，将 `Codex Minus.app` 放入「应用程序」。
            Windows：Intel／AMD 选择 `x64-setup.exe`；ARM 选择 `arm64-setup.exe`。
            旧 Tauri 版可通过应用内更新自动迁移；用户配置仍在 `~/.codex-session-delete/`。

            Electron 版启动时检查更新，点击「安装更新」后验证签名再安装。更新不会重启官方 Codex 客户端。
            `latest.json` 为旧 Tauri 版提供一次性升级；`electron-latest.json` 及其签名用于后续 Electron 更新。
            Windows arm64 的构建／资源检查不等于原生安装验收。
            安装包、签名与清单的 SHA-256 见 `SHA256SUMS`。
          files: artifacts/dist/*
          fail_on_unmatched_files: true
